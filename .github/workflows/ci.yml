name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Build de produccion
        run: npx ng build

      - name: Tests (Vitest)
        run: npx ng test --watch=false
