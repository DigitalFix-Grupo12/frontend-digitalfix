<h2>Órdenes de trabajo</h2>

<p *ngIf="error()" class="error">{{ error() }}</p>
<p *ngIf="loading()">Cargando...</p>

<form *ngIf="canCreate()" [formGroup]="form" (ngSubmit)="create()" class="new-order">
  <input formControlName="descripcion" placeholder="Descripción del trabajo" />
  <input formControlName="clienteId" placeholder="ID cliente" />
  <button type="submit" [disabled]="form.invalid">Crear orden</button>
</form>

<table *ngIf="!loading()">
  <thead>
    <tr><th>ID</th><th>Descripción</th><th>Cliente</th><th>Estado</th><th *ngIf="canAdvance()"></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let o of orders()">
      <td>{{ o.id }}</td>
      <td>{{ o.descripcion }}</td>
      <td>{{ o.clienteId }}</td>
      <td>{{ o.status }}</td>
      <td *ngIf="canAdvance()">
        <button *ngIf="nextStatus[o.status]" (click)="advance(o)">
          Avanzar a {{ nextStatus[o.status] }}
        </button>
      </td>
    </tr>
  </tbody>
</table>
