<h2>Reportería (últimas 24h)</h2>
<p *ngIf="error()" class="error">{{ error() }}</p>
<ul *ngIf="kpis() as k">
  <li>Órdenes por hora: {{ k.ordenesPorHora }}</li>
  <li>Tiempo de resolución promedio: {{ k.tiempoResolucionPromedioMin }} min</li>
  <li>Estados activos: {{ k.estadosActivos }}</li>
</ul>
